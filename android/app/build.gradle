plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.obby.pokeplanet'
    compileSdk 36
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'ca.obby.pokeplanet'
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName rootProject.file('../VERSION').text.trim()

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/borderAssets'))
}

tasks.register('copyBorderAsset', Sync) {
    from(rootProject.file('..')) {
        include 'BG*.png'
        include 'Border.png'
    }
    into layout.buildDirectory.dir('generated/borderAssets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyBorderAsset')
}
