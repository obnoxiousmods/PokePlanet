name: CI

# What can actually be checked on a runner, checked on every push.
#
# The game itself is not built here on purpose: it needs a 32-bit cross toolchain, SDL2 and the
# decomp's build tools, and a job that takes twenty minutes and breaks for environment reasons
# gets ignored within a week. The parts below are fast and fail for real reasons.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server and protocol tests
    runs-on: ubuntu-latest
    # A real Postgres so the persistence round-trip -- the one bug class that permanently
    # destroys player data -- is actually exercised, not just the in-memory rules.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokeplanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POKEPLANET_TEST_DB: postgres://postgres:postgres@localhost:5432/pokeplanet_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The world rules live here: movement validation, chat routing, battle seating, save
      # parsing and the rate config. This is the suite worth protecting. With a database
      # attached it also runs the persistence round-trip and the account/session/ban SQL.
      - name: Tests
        working-directory: server
        run: cargo test --all

      - name: Clippy
        working-directory: server
        run: cargo clippy --all -- -D warnings

      - name: Formatting
        working-directory: server
        run: cargo fmt --all -- --check

  chat-parse:
    name: Chat scope parsing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles the game's own parser on the host and runs every case, including the ones
      # that must NOT be treated as broadcasts. A whisper going to the wrong audience is the
      # kind of bug that cannot be taken back.
      - name: Run
        run: bash tools/debug/test-chat-parse.sh

  roadmap:
    name: README mirrors ROADMAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The two are meant to be byte identical. Left to humans this drifts within a month, and
      # a roadmap that lags is worse than none because people act on it.
      - name: Compare
        run: |
          if ! cmp -s README.md ROADMAP.md; then
            echo "README.md and ROADMAP.md have drifted apart."
            echo "They are meant to be identical -- update both in the same commit."
            diff README.md ROADMAP.md || true
            exit 1
          fi

  game:
    name: Game builds (Linux headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing used to compile the C at all, so a link-breaking change reached a shipped
      # binary once this session and was caught only by luck. This builds the native Linux
      # target -- the one the server runs headless -- which links the entire game.
      - name: Install 32-bit build dependencies
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # SDL2 headers are architecture-independent, so the amd64 -dev package supplies them
          # and avoids the libglib2.0-dev:i386 conflict that installing libsdl2-dev:i386 drags
          # in. Only the runtime .so needs to be i386; the linker name (libSDL2.so) is added by
          # hand because it normally comes from the -dev package we are deliberately not using.
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib build-essential \
            libsdl2-dev libsdl2-2.0-0:i386 \
            libpng-dev zlib1g-dev
          SO=$(dpkg -L libsdl2-2.0-0:i386 | grep -m1 'libSDL2-2.0.so.0$')
          sudo ln -sf "$SO" "$(dirname "$SO")/libSDL2.so"
          # SDL2's multiarch SDL_config.h is a stub that includes _real_SDL_config.h from the
          # arch include dir. A -m32 compile looks in i386-linux-gnu, which the amd64 -dev
          # package does not populate; the amd64 real config is fine for our API-only use, so
          # point the i386 path at it rather than pull the conflicting libsdl2-dev:i386.
          sudo mkdir -p /usr/include/i386-linux-gnu/SDL2
          sudo ln -sf /usr/include/x86_64-linux-gnu/SDL2/_real_SDL_config.h \
            /usr/include/i386-linux-gnu/SDL2/_real_SDL_config.h

      - name: Build headless
        run: make -f Makefile_pc NATIVE_LINUX=1 NO_SDL_IMAGE=1 rom -j"$(nproc)"

      - name: Confirm the binary exists
        run: test -x ./pokeemerald && file ./pokeemerald
