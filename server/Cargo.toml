[workspace]
resolver = "2"
members = ["proto", "server", "net"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
# The sidecar ships next to the game, so size and startup cost matter. Deliberately not
# panic="abort": the server must survive one connection's panic without dropping the rest.
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
pokeplanet-proto = { path = "proto" }

anyhow = "1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rand = "0.8"
